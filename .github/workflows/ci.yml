name: CI — Everything Antigravity

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: System Health Check
  # ─────────────────────────────────────────────────────
  health-check:
    name: 🏥 EAG Doctor Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Run EAG Doctor
        run: ./scripts/eag-doctor.sh

  # ─────────────────────────────────────────────────────
  # Job 2: Full Verification Suite
  # ─────────────────────────────────────────────────────
  verify:
    name: ✅ Full Verification Suite
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Run verification suite
        run: ./scripts/verify-all.sh

  # ─────────────────────────────────────────────────────
  # Job 3: Commit Message Lint
  # ─────────────────────────────────────────────────────
  commitlint:
    name: 📝 Commit Message Convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ─────────────────────────────────────────────────────
  # Job 4: Security Audit
  # ─────────────────────────────────────────────────────
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
